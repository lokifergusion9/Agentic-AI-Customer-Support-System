# Local infrastructure: PostgreSQL and the mock external services.
#
#   docker compose up -d                    # PostgreSQL only
#   docker compose --profile mocks up -d    # PostgreSQL + mock services
#
# The mock services (W1.8 payments, W1.9 shipping, W1.10 ticketing) sit behind the "mocks"
# profile. They keep state in memory, so load it after starting them:
#   uv run python -m scripts.seed_data --push-mocks
# Every value has a local-only default and can be overridden from .env (P0.4).

name: customer-support-resolution-agent

x-mock-service: &mock-service
  image: ghcr.io/astral-sh/uv:0.12.5-python3.13-trixie-slim
  profiles: ["mocks"]
  working_dir: /workspace
  volumes:
    - .:/workspace
    - uv-cache:/root/.cache/uv
  environment: &mock-env
    # Keep the container's virtualenv out of the bind-mounted host .venv.
    UV_PROJECT_ENVIRONMENT: /opt/venv
    UV_LINK_MODE: copy
  restart: unless-stopped

services:
  postgres:
    # PostgreSQL 17 with pgvector (Q3 decided). The extension is enabled by a
    # migration (CREATE EXTENSION vector), not by this container.
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support}
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mock-payments:
    <<: *mock-service
    command: >
      uv run --frozen --no-dev
      uvicorn mock_services.payments.main:app --host 0.0.0.0 --port 8001
    environment:
      <<: *mock-env
      MOCK_PAYMENTS_API_KEY: ${MOCK_PAYMENTS_API_KEY:-mock-payments-local-key}
    ports:
      - "${MOCK_PAYMENTS_PORT:-8001}:8001"

  mock-shipping:
    <<: *mock-service
    command: >
      uv run --frozen --no-dev
      uvicorn mock_services.shipping.main:app --host 0.0.0.0 --port 8002
    environment:
      <<: *mock-env
      MOCK_SHIPPING_API_KEY: ${MOCK_SHIPPING_API_KEY:-mock-shipping-local-key}
    ports:
      - "${MOCK_SHIPPING_PORT:-8002}:8002"

  mock-ticketing:
    <<: *mock-service
    command: >
      uv run --frozen --no-dev
      uvicorn mock_services.ticketing.main:app --host 0.0.0.0 --port 8003
    environment:
      <<: *mock-env
      MOCK_TICKETING_API_KEY: ${MOCK_TICKETING_API_KEY:-mock-ticketing-local-key}
    ports:
      - "${MOCK_TICKETING_PORT:-8003}:8003"

  # W3.13: the job worker, on its own so it can be killed and restarted alone:
  #   docker compose --profile mocks --profile worker up -d
  #   docker compose kill worker && docker compose --profile worker up -d worker
  # Run the API with RUN_EXECUTION=worker too, so it queues jobs instead of running them.
  worker:
    <<: *mock-service
    profiles: ["worker"]
    command: uv run --frozen --no-dev python -m app.jobs.worker
    env_file:
      - path: .env
        required: false
    environment:
      <<: *mock-env
      RUN_EXECUTION: worker
      # Container hostnames instead of the localhost URLs in .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:-support}@postgres:5432/${POSTGRES_DB:-support}
      MOCK_PAYMENTS_URL: http://mock-payments:8001
      MOCK_SHIPPING_URL: http://mock-shipping:8002
      MOCK_TICKETING_URL: http://mock-ticketing:8003
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uv-cache:
