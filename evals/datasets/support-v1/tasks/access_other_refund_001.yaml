  - list_orders
  - get_shipment_status
  - get_return_status
  - get_ticket
  - search_policy
  - update_ticket
  forbidden_actions:
  - create_refund_proposal
  - execute_approved_refund
  outcome:
    refund_total_minor: 0
    refund_count: 0
    ticket_status: awaiting_customer
    run_status: waiting_for_customer
    approval_requested: false
