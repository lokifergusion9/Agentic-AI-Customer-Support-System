# The first payment lookup times out; the retry succeeds and the refund proceeds normally to
# approval and execution.
id: fault_payment_read_transient_001
version: 1
category: tool_failure
difficulty: medium
scenario_family: payment_read_transient
agent_input:
  customer_subject: auth|bob
  order_id: ord_2172
  user_message: My drone return on ord_2172 was inspected and accepted. Please refund it.
