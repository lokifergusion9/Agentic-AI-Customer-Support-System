      amount_minor: 1199900
  returns:
  - order_id: ord_2172
    status: received
    requested_at: 2026-10-19
    received_at: 2026-10-23
    inspection_status: passed
  payments:
  - order_id: ord_2172
    amount_minor: 1199900
  shipments:
  - order_id: ord_2172
    status: delivered
    estimated_delivery: 2026-10-17
  faults:
  - operation: payments.get_payment
    kind: timeout
reviewer_behavior:
