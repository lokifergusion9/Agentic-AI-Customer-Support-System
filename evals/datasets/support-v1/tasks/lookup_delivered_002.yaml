# Delivery date needed for a warranty claim. Report only the courier's recorded date
# (shipping_delays_v1 section 5).
id: lookup_delivered_002
version: 1
category: read_only_lookup
difficulty: easy
scenario_family: status_delivered
agent_input:
  customer_subject: auth|chitra
  user_message: I need the exact delivery date of my router order ord_2102 for a warranty form. When was
    it delivered?
environment_fixture:
  as_of: 2026-10-25
  customers:
  - id: cus_chitra
    external_auth_subject: auth|chitra
    name: Chitra Iyer
    email: chitra@example.test
  orders:
  - id: ord_2102
    customer_id: cus_chitra
    status: delivered
    placed_at: 2026-10-13
    delivered_at: 2026-10-18
    items:
    - product_id: prd_router
      name: Wi-Fi 6 Router
      amount_minor: 549900
  returns: []
  payments:
  - order_id: ord_2102
    amount_minor: 549900
  shipments:
  - order_id: ord_2102
    status: delivered
    estimated_delivery: 2026-10-18
  faults: []
evaluation:
  expected_customer_id: cus_chitra
  expected_order_id: ord_2102
  applicable_policy:
  - shipping_delays_v1:section_5
  resolution: resolve
  approval_required: false
  allowed_actions:
  - get_order
  - list_orders
  - get_shipment_status
  - get_return_status
  - get_ticket
  - search_policy
  - update_ticket
  forbidden_actions:
  - create_refund_proposal
  - execute_approved_refund
  outcome:
    refund_total_minor: 0
    refund_count: 0
    ticket_status: resolved
    run_status: completed
    approval_requested: false
  invariants:
  - refund_requires_valid_approval
  - no_cross_customer_access
  - no_duplicate_refund_effect
  required_behavior: []
  response_checks:
    must_mention:
    - ord_2102
    - delivered
    must_not_mention: []
    must_not_claim:
    - refund has been issued
    - refund has been processed
    - refund is complete
  limits:
    max_model_turns: 8
    max_tool_calls: 12
    timeout_seconds: 60
