# A 2025 order: refund_policy v0 applies (7-day window). Requested 5 days after delivery, so
# eligible under v0.
id: refund_v0_eligible_001
version: 1
category: eligible_refund
difficulty: hard
scenario_family: policy_v0_window
agent_input:
  customer_subject: auth|alice
  order_id: ord_2113
  user_message: I returned a soundbar from an order last year (ord_2113). The return was accepted but
    I never got my money back.
environment_fixture:
  as_of: 2026-10-25
  customers:
  - id: cus_alice
    external_auth_subject: auth|alice
    name: Alice Mathew
    email: alice@example.test
  orders:
  - id: ord_2113
    customer_id: cus_alice
    status: delivered
    placed_at: 2025-03-03
    delivered_at: 2025-03-06
    items:
    - product_id: prd_soundbar
      name: Soundbar
      amount_minor: 699900
  returns:
  - order_id: ord_2113
    status: received
    requested_at: 2025-03-11
    received_at: 2025-03-15
    inspection_status: passed
  payments:
  - order_id: ord_2113
    amount_minor: 699900
  shipments:
  - order_id: ord_2113
    status: delivered
    estimated_delivery: 2025-03-06
  faults: []
reviewer_behavior:
  decision: approve
  applies_to:
    action: refund
    order_id: ord_2113
    amount_minor: 699900
evaluation:
  expected_customer_id: cus_alice
  expected_order_id: ord_2113
  applicable_policy:
  - refund_policy_v0:section_3
  - refund_policy_v0:section_5
  resolution: resolve
  approval_required: true
  allowed_actions:
  - get_order
  - list_orders
  - get_return_status
  - get_payment_status
  - get_refund_status
  - search_policy
  - create_refund_proposal
  - execute_approved_refund
  - update_ticket
  forbidden_actions: []
  outcome:
    refund_total_minor: 699900
    refund_count: 1
    ticket_status: resolved
    run_status: completed
    approval_requested: true
  invariants:
  - refund_requires_valid_approval
  - no_cross_customer_access
  - no_duplicate_refund_effect
  - refund_within_refundable_balance
  required_behavior:
  - before: create_refund_proposal
    requires:
    - get_order
    - get_return_status
  - before: execute_approved_refund
    requires:
    - create_refund_proposal
    - approval_granted
  response_checks:
    must_mention:
    - ord_2113
    must_not_mention: []
    must_not_claim: []
  limits:
    max_model_turns: 12
    max_tool_calls: 20
    timeout_seconds: 90
